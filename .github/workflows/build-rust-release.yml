name: Build Rust client release

on:
  workflow_dispatch:
   push:
     tags:
       - 'v*'

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  build:
    name: Build - ${{ matrix.display_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_suffix: linux_amd64
            display_name: "Linux AMD64 (musl)"
            cross: true
            archive: tar.gz
            rustflags: '-C target-feature=+crt-static'
            optional: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_suffix: linux_arm64
            display_name: "Linux ARM64 (musl)"
            cross: true
            archive: tar.gz
            rustflags: '-C target-feature=+crt-static'
            optional: false

          - os: ubuntu-latest
            target: arm-unknown-linux-musleabi
            artifact_suffix: linux_arm
            display_name: "Linux ARM (musl soft-float)"
            cross: true
            archive: tar.gz
            rustflags: '-C target-feature=+crt-static'
            optional: false

          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            artifact_suffix: linux_arm_hf
            display_name: "Linux ARMv7 (musl hard-float)"
            cross: true
            archive: tar.gz
            rustflags: '-C target-feature=+crt-static'
            optional: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: darwin_arm64
            display_name: "macOS ARM64"
            cross: false
            archive: tar.gz
            rustflags: ''
            optional: false

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_suffix: darwin_amd64
            display_name: "macOS AMD64"
            cross: false
            archive: tar.gz
            rustflags: ''
            optional: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows_amd64
            display_name: "Windows AMD64"
            cross: false
            archive: zip
            rustflags: '-C target-feature=+crt-static'
            optional: false

          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            artifact_suffix: linux_riscv64
            display_name: "Linux RISC-V 64 (musl)"
            cross: true
            archive: tar.gz
            rustflags: '-C target-feature=+crt-static'
            optional: true

          - os: ubuntu-latest
            target: loongarch64-unknown-linux-musl
            artifact_suffix: linux_loong64
            display_name: "Linux LoongArch64 (musl)"
            cross: true
            archive: tar.gz
            rustflags: '-C target-feature=+crt-static'
            optional: true

          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            artifact_suffix: freebsd_amd64
            display_name: "FreeBSD AMD64"
            cross: true
            archive: tar.gz
            rustflags: ''
            optional: true

          - os: ubuntu-latest
            target: aarch64-linux-android
            artifact_suffix: android_arm64
            display_name: "Android ARM64"
            cross: true
            archive: tar.gz
            rustflags: ''
            optional: true

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact_suffix: windows_arm64
            display_name: "Windows ARM64"
            cross: false
            archive: zip
            rustflags: '-C target-feature=+crt-static'
            optional: true

    continue-on-error: ${{ matrix.optional }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write

    defaults:
      run:
        working-directory: agent-rs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-rs
          key: ${{ matrix.target }}

      - name: Install protoc
        if: ${{ !matrix.cross }}
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.cross
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          SUFFIX="${{ matrix.artifact_suffix }}"
          TARGET="${{ matrix.target }}"
          RELEASE_NAME="orbien-rs_${VERSION}_${SUFFIX}"
          SRC="agent-rs/target/${TARGET}/release/orbien"

          test -f "$SRC"
          mkdir -p "$RELEASE_NAME"
          cp "$SRC" "$RELEASE_NAME/orbien"
          chmod +x "$RELEASE_NAME/orbien"
          cp agent-rs/examples/orbien.toml "$RELEASE_NAME/orbien.toml"

          tar -czf "${RELEASE_NAME}.tar.gz" "$RELEASE_NAME"
          ls -lh "${RELEASE_NAME}.tar.gz"
          file "$RELEASE_NAME/orbien" || true

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $VERSION = "${{ github.ref_name }}"
          $SUFFIX = "${{ matrix.artifact_suffix }}"
          $TARGET = "${{ matrix.target }}"
          $RELEASE_NAME = "orbien-rs_${VERSION}_${SUFFIX}"
          $SRC = "agent-rs\target\${TARGET}\release\orbien.exe"

          if (-not (Test-Path $SRC)) { throw "binary not found: $SRC" }
          New-Item -ItemType Directory -Force -Path $RELEASE_NAME | Out-Null
          Copy-Item $SRC "$RELEASE_NAME\orbien.exe"
          Copy-Item "agent-rs\examples\orbien.toml" "$RELEASE_NAME\orbien.toml"
          Compress-Archive -Path "$RELEASE_NAME\*" -DestinationPath "$RELEASE_NAME.zip" -Force
          Get-Item "$RELEASE_NAME.zip" | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbien-rs-${{ matrix.artifact_suffix }}-${{ github.ref_name }}
          path: orbien-rs_${{ github.ref_name }}_${{ matrix.artifact_suffix }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Publish release assets
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: 'orbien-rs-*'
          merge-multiple: true

      - name: List assets
        run: find artifacts -type f | sort

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
